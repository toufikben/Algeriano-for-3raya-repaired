name: Deploy Privacy Policy

on:
  push:
    branches: [main]
    paths:
      - 'privacy-policy.html'
      - '.github/workflows/deploy-privacy-policy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: privacy-policy-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload policy
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy policy
        id: deployment
        uses: actions/deploy-pages@v4
